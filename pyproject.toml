[project]
name = "torro"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "python-telegram-bot>=21",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["torro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
